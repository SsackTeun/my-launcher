<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>플레이어</title>
  <link rel="stylesheet" href="style.css" />
</head>
<!-- 플레이어 창: 작게(재생기 아이콘 · 미니 플레이어 · 가사 줄) / 크게(큰 앨범 · 다음 트랙 · 가사 · 앨범 · 플레이리스트 · 랜덤) -->
<body class="detached floating music compact">
  <div id="app">
    <!-- 위쪽 줄: 재생기 아이콘 · (잡고 끌어 옮기기) · 위치 고정 · 창 정리 · 크게 보기 · 설정 · 숨기기 -->
    <header class="ptool" data-tauri-drag-region>
      <div class="sites" id="sites"></div>
      <span class="ptool-grip" data-tauri-drag-region><i data-tauri-drag-region></i></span>
      <div class="pl-tools">
        <button class="icon" id="lockBtn" title="창 위치 고정"></button>
        <button class="icon" id="tidyBtn" title="창 정리"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="9" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="5.5" y="6.5" width="9" height="7" rx="1.2" fill="currentColor"/></svg></button>
        <button class="icon" id="bigBtn" title="크게 보기"></button>
        <button class="icon" id="updBtn" title="업데이트 확인"><svg viewBox="0 0 16 16"><path d="M8 13V3.5M4 7.2 8 3.2l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon" id="gearBtn" title="설정"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <button class="icon" id="close" title="숨기기 (트레이 🧰 에서 다시 열기)">×</button>
      </div>
    </header>
    <div class="mz">
      <!-- 왼쪽(작게: 전체): 큰 앨범 · 곡 · 조작 · 가사 줄 -->
      <aside class="mz-left">
        <div class="mz-art"><img id="art" alt="" referrerpolicy="no-referrer" hidden></div>
        <section id="player" class="player"></section>
        <section id="lyline" class="lyline" hidden></section>
        <!-- 크게 볼 때 왼쪽 아래 빈칸: 노래를 따라 흐르는 가사 (기본 지금 · 다음 두 줄) -->
        <section id="lyside" class="lyside" hidden></section>
      </aside>
      <!-- 오른쪽(크게만): 다음 트랙 · 가사 · 앨범 · 플레이리스트 · 랜덤 -->
      <main class="mz-right">
        <nav class="mz-tabs">
          <div class="seg" id="mzTabs"></div>
          <span class="mz-sp"></span>
          <span class="mz-status" id="mzStatus"></span>
        </nav>
        <div class="mz-body" id="mzBody"></div>
        <div class="mz-bar" id="mzBar" hidden></div>
      </main>
    </div>
    <!-- 크게 볼 때 오른쪽 아래 모서리: 끌어서 크기 조절 -->
    <div class="mz-resize" id="mzResize" title="끌어서 크기 조절"></div>
    <!-- 크게 볼 때 아래 가장자리: 위아래로 끌어서 높이 조절 · 더블클릭하면 기본 높이 (Mac 판과 같음) -->
    <div class="mz-resize-s" id="mzResizeS" title="위아래로 끌어서 창 높이 조절 · 더블클릭하면 기본 높이"></div>
  </div>
  <div id="menu" class="menu" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <script src="common.js"></script>
  <script src="pron.js"></script>
  <script src="player.js"></script>
  <script src="sites.js"></script>
  <script src="music.js"></script>
</body>
</html>
